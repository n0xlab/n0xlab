<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="n0xlab terminal">
# стили: цвета терминала, анимации печати, появления строк, мигания курсора и пульса нейросети
<style>
  text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
  .term { font-size: 18px; }
  .g { fill: #39d353; }
  .b { fill: #58a6ff; }
  .w { fill: #e6edf3; }
  .dim { fill: #8b949e; }
  .cover { fill: #0d1117; animation-fill-mode: both; animation-timing-function: steps(1, end); }
  .t1 { animation: type1 0.9s steps(17) 0.4s both; }
  .t3 { animation: type3 1.2s steps(26) 1.9s both; }
  @keyframes type1 { to { transform: translateX(183.6px); } }
  @keyframes type3 { to { transform: translateX(280.8px); } }
  .show2 { animation: show 0.01s 1.45s both; }
  .show4 { animation: show 0.01s 3.25s both; }
  .show5 { animation: show 0.01s 3.6s both; }
  @keyframes show { from { opacity: 0; } to { opacity: 1; } }
  .cursor { fill: #39d353; animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .net line { stroke: #39d353; stroke-opacity: 0.18; stroke-width: 1; }
  .net circle { fill: #0d1117; stroke: #39d353; stroke-width: 1.5; }
  .net .core { fill: #39d353; stroke: none; animation: pulse 2.4s ease-in-out infinite both; }
  @keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
</style>
# эффекты: свечение логотипа и полосы старого монитора
<defs>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
  </pattern>
  <clipPath id="win"><rect width="900" height="330" rx="12"/></clipPath>
</defs>
<g clip-path="url(#win)">
# окно терминала и заголовок с тремя кнопками
<rect width="900" height="330" fill="#0d1117"/>
<rect width="900" height="36" fill="#161b22"/>
<circle cx="24" cy="18" r="6" fill="#ff5f56"/>
<circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
<circle cx="64" cy="18" r="6" fill="#27c93f"/>
<text x="450" y="23" font-size="13" text-anchor="middle" class="dim">n0x@lab: ~</text>
# логотип и подзаголовок
<text x="40" y="112" font-size="64" font-weight="700" class="g" filter="url(#glow)">n0xlab</text>
<text x="42" y="142" font-size="15" class="dim">code · lessons · learning in public</text>
# строки терминала: команды печатаются, ответы появляются
<g class="term">
  <text x="40" y="188" textLength="183.6" lengthAdjust="spacing"><tspan class="g">n0x@lab</tspan><tspan class="b">:~$</tspan><tspan class="w"> whoami</tspan></text>
  <rect class="cover t1" x="39" y="168" width="187.6" height="28"/>
  <text class="dim show2" x="40" y="216" textLength="32.4" lengthAdjust="spacing">n0x</text>
  <text x="40" y="248" textLength="280.8" lengthAdjust="spacing"><tspan class="g">n0x@lab</tspan><tspan class="b">:~$</tspan><tspan class="w"> cat mission.txt</tspan></text>
  <rect class="cover t3" x="39" y="228" width="284.8" height="28"/>
  <text class="g show4" x="40" y="276" textLength="442.8" lengthAdjust="spacing">I don&#39;t just write code. I write lessons.</text>
  <g class="show5">
    <text x="40" y="306" textLength="108.0" lengthAdjust="spacing"><tspan class="g">n0x@lab</tspan><tspan class="b">:~$</tspan></text>
    <rect class="cursor" x="158.8" y="291" width="10.8" height="19"/>
  </g>
</g>
# нейросеть справа: связи и пульсирующие нейроны
<g class="net">
  <line x1="690" y1="125" x2="770" y2="95"/>
  <line x1="690" y1="125" x2="770" y2="155"/>
  <line x1="690" y1="125" x2="770" y2="215"/>
  <line x1="690" y1="125" x2="770" y2="275"/>
  <line x1="690" y1="185" x2="770" y2="95"/>
  <line x1="690" y1="185" x2="770" y2="155"/>
  <line x1="690" y1="185" x2="770" y2="215"/>
  <line x1="690" y1="185" x2="770" y2="275"/>
  <line x1="690" y1="245" x2="770" y2="95"/>
  <line x1="690" y1="245" x2="770" y2="155"/>
  <line x1="690" y1="245" x2="770" y2="215"/>
  <line x1="690" y1="245" x2="770" y2="275"/>
  <line x1="770" y1="95" x2="850" y2="155"/>
  <line x1="770" y1="95" x2="850" y2="215"/>
  <line x1="770" y1="155" x2="850" y2="155"/>
  <line x1="770" y1="155" x2="850" y2="215"/>
  <line x1="770" y1="215" x2="850" y2="155"/>
  <line x1="770" y1="215" x2="850" y2="215"/>
  <line x1="770" y1="275" x2="850" y2="155"/>
  <line x1="770" y1="275" x2="850" y2="215"/>
  <circle cx="690" cy="125" r="7"/>
  <circle class="core" cx="690" cy="125" r="3" style="animation-delay:0s"/>
  <circle cx="690" cy="185" r="7"/>
  <circle class="core" cx="690" cy="185" r="3" style="animation-delay:0.35s"/>
  <circle cx="690" cy="245" r="7"/>
  <circle class="core" cx="690" cy="245" r="3" style="animation-delay:0.7s"/>
  <circle cx="770" cy="95" r="7"/>
  <circle class="core" cx="770" cy="95" r="3" style="animation-delay:1.05s"/>
  <circle cx="770" cy="155" r="7"/>
  <circle class="core" cx="770" cy="155" r="3" style="animation-delay:1.4s"/>
  <circle cx="770" cy="215" r="7"/>
  <circle class="core" cx="770" cy="215" r="3" style="animation-delay:1.75s"/>
  <circle cx="770" cy="275" r="7"/>
  <circle class="core" cx="770" cy="275" r="3" style="animation-delay:2.1s"/>
  <circle cx="850" cy="155" r="7"/>
  <circle class="core" cx="850" cy="155" r="3" style="animation-delay:2.45s"/>
  <circle cx="850" cy="215" r="7"/>
  <circle class="core" cx="850" cy="215" r="3" style="animation-delay:2.8s"/>
</g>
# полосы поверх всего изображения
<rect width="900" height="330" fill="url(#scan)"/>
</g>
<rect x="0.5" y="0.5" width="899" height="329" rx="12" fill="none" stroke="#30363d"/>
</svg>
